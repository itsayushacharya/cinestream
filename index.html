<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/ico.png">
    <style>
        /* Modern Design System Architecture Tokens */
        :root {
            --bg-deep: #050508;
            --bg-surface: #0e0e12;
            --bg-surface-elevated: #16161f;
            --accent-primary: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-primary: #f5f5f7;
            --text-secondary: #94a3b8;
            --text-accent: #ffcc00;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --radius-main: 16px;
            --radius-pill: 100px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: all 0.6s var(--ease-out-expo);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           CINEMATIC SPLASH SCREEN — ANIMATED BACKGROUND + SOUND
           ============================================================ */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(ellipse at 50% 40%, #1a0508 0%, #050508 60%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ---- Animated background layers ---- */
        .splash-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        /* Layer 1: slow-moving nebula / light sweep */
        .splash-aurora {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(229, 9, 20, 0.18) 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, rgba(120, 20, 220, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at 50% 80%, rgba(229, 9, 20, 0.10) 0%, transparent 40%);
            animation: auroraDrift 14s ease-in-out infinite alternate;
        }

        @keyframes auroraDrift {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            100% { transform: translate(-6%, -4%) rotate(6deg) scale(1.12); }
        }

        /* Layer 2: repeating film-grain scanline texture */
        .splash-scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.018) 0px,
                rgba(255, 255, 255, 0.018) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            animation: scanlineShift 8s linear infinite;
        }

        @keyframes scanlineShift {
            0%   { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* Layer 3: subtle vignette to focus the centre */
        .splash-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
            pointer-events: none;
        }

        /* ---- Floating dust / particle specks ---- */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.15);
            animation: floatUp linear infinite;
            will-change: transform, opacity;
            pointer-events: none;
        }

        .particle.red {
            background: rgba(229, 9, 20, 0.7);
            box-shadow: 0 0 10px 3px rgba(229, 9, 20, 0.35);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) translateX(var(--drift, 20px)) scale(0.4);
                opacity: 0;
            }
        }

        /* ---- Centered logo / brand block ---- */
        .splash-logo-wrap {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: splashZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-logo-wrap::before {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.3) 0%, transparent 68%);
            border-radius: 50%;
            animation: splashGlow 2.2s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        .splash-brand {
            font-size: 3.6rem;
            font-weight: 800;
            letter-spacing: -1.8px;
            color: var(--text-primary);
            opacity: 0;
            animation: splashTextReveal 0.9s 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-shadow: 0 0 45px rgba(229, 9, 20, 0.55);
            line-height: 1.05;
        }

        .splash-brand span {
            color: var(--accent-primary);
        }

        .splash-tagline {
            margin-top: 14px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0;
            animation: splashTextReveal 0.9s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ---- Progress loader ---- */
        .splash-loader {
            position: absolute;
            bottom: 80px;
            z-index: 3;
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            overflow: hidden;
            opacity: 0;
            animation: splashTextReveal 0.6s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), #ff4d4d, #ffcc00);
            border-radius: 100px;
            animation: splashLoad 1.5s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        /* ---- Keyframes ---- */
        @keyframes splashZoom {
            0%   { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes splashGlow {
            0%   { transform: scale(0.85); opacity: 0.55; }
            100% { transform: scale(1.18); opacity: 1; }
        }

        @keyframes splashTextReveal {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes splashLoad {
            0%   { width: 0%; }
            100% { width: 100%; }
        }

        /* ---- Site content reveal ---- */
        .site-content {
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site-content.revealed {
            opacity: 1;
        }

        /* Fluid Premium Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #1f1f2e; border-radius: var(--radius-pill); }
        ::-webkit-scrollbar-thumb:hover { background: #2f2f45; }

        /* Glassmorphic Top Bar Navigation Component */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 6%;
            z-index: 1300;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(5,5,8,0.95) 0%, rgba(5,5,8,0) 100%);
            transition: var(--transition-smooth);
        }

        header.scrolled {
            padding: 14px 6%;
            background: rgba(14, 14, 18, 0.85);
            backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.8px;
        }

        .logo span { color: var(--accent-primary); }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .category-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        /* Micro-Interactive Search Bar */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            padding: 10px 16px 10px 42px;
            border-radius: var(--radius-pill);
            color: white;
            font-size: 0.85rem;
            width: 240px;
            transition: var(--transition-smooth);
            outline: none;
        }

        .search-container input:focus {
            width: 320px;
            border-color: rgba(229, 9, 20, 0.6);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.2);
        }

        .search-container svg {
            position: absolute;
            left: 16px;
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .search-container input:focus + svg { fill: var(--accent-primary); }

        /* Hero Carousel */
        .hero-carousel-container {
            position: relative;
            height: 85vh;
            min-height: 580px;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 20px;
        }

        .hero-track {
            display: flex;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hero-slide {
            height: 100%;
            position: relative;
            background-size: cover !important;
            background-position: center 20% !important;
            background-repeat: no-repeat !important;
            display: flex;
            align-items: center;
            padding: 0 6%;
            width: 100vw;
            flex-shrink: 0;
        }

        .hero-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(5,5,8,0.98) 25%, rgba(5,5,8,0.6) 60%, rgba(5,5,8,0) 90%),
                        linear-gradient(to top, var(--bg-deep) 0%, rgba(5,5,8,0.2) 40%, rgba(5,5,8,0) 100%);
            z-index: 1;
        }

        .hero-inner {
            max-width: 650px;
            z-index: 2;
            position: relative;
        }

        .badge-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .spotlight-badge {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #b80710 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .genre-badge {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 5px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
        }

        .hero-title {
            font-size: 3.6rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -2px;
            text-shadow: 0 4px 24px rgba(0,0,0,0.7);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .rating-star {
            color: var(--text-accent);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
        }

        .hero-description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: rgba(245, 245, 247, 0.75);
            margin-bottom: 36px;
        }

        .btn-stream {
            background: var(--text-primary);
            color: var(--bg-deep);
            border: none;
            padding: 14px 32px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--radius-main);
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
        }

        .btn-stream:hover {
            transform: translateY(-4px);
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        /* Rows */
        .content-wrap { padding-bottom: 80px; }
        .row-container { margin-bottom: 40px; }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6%;
            margin-bottom: 20px;
        }

        .row-title {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: var(--radius-pill);
        }

        .carousel-arrows { display: flex; gap: 10px; }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .arrow-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .arrow-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .carousel-viewport {
            padding: 10px 6% 20px 6%;
            overflow-x: auto;
            display: flex;
            gap: 24px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .carousel-viewport::-webkit-scrollbar { display: none; }

        .empty-placeholder-msg {
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 20px 0;
            font-style: italic;
            grid-column: 1 / -1;
        }

        /* Media Cards */
        .media-card {
            flex: 0 0 230px;
            background: var(--bg-surface);
            border-radius: var(--radius-main);
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
        }

        .media-card:hover {
            transform: translateY(-10px) scale(1.03);
            background: var(--bg-surface-elevated);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border-color: rgba(255,255,255,0.1);
        }

        .poster-wrapper {
            position: relative;
            padding-top: 145%;
            background: #121216;
            overflow: hidden;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.8s var(--ease-out-expo);
        }

        .media-card:hover .poster-wrapper img { transform: scale(1.06); }

        .card-dark-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5,5,8,0.9) 0%, transparent 70%);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .media-card:hover .card-dark-overlay { opacity: 1; }

        .info-circle-btn {
            background: white;
            color: black;
            padding: 10px 18px;
            font-weight: 700;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            transform: translateY(15px);
            transition: var(--transition-smooth);
        }

        .media-card:hover .info-circle-btn { transform: translateY(0); }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .type-tag { color: var(--accent-primary); }

        .card-rating {
            color: var(--text-accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-genre {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Dots */
        .carousel-dots {
            position: absolute;
            bottom: 40px;
            right: 6%;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .dot.active {
            background: var(--accent-primary);
            width: 30px;
            border-radius: var(--radius-pill);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Details Panel */
        .details-panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3,3,5,0.85);
            backdrop-filter: blur(20px);
            z-index: 1500;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .details-panel-overlay.active { display: flex; opacity: 1; }

        .details-card-box {
            background: var(--bg-surface-elevated);
            width: 90%;
            max-width: 750px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            transform: scale(0.9) translateY(20px);
            transition: var(--transition-smooth);
            position: relative;
        }

        .details-panel-overlay.active .details-card-box {
            transform: scale(1) translateY(0);
        }

        .details-banner-img {
            height: 320px;
            background-size: cover !important;
            background-position: center 20% !important;
            position: relative;
        }

        .details-banner-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-surface-elevated) 0%, transparent 100%);
        }

        .details-info-content { padding: 32px; position: relative; }

        .close-details-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-subtle);
            color: white;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .details-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .details-meta-row {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 18px;
            align-items: center;
        }

        .details-desc-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.75);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .play-master-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--radius-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .play-master-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px var(--accent-glow);
            background: #ff121d;
        }

        /* Category Modal */
        .category-modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 1200;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s var(--ease-out-expo);
            overflow-y: auto;
            padding: 40px 6% 60px 6%;
        }

        .category-modal-overlay.active { display: flex; opacity: 1; }

        .category-modal-overlay::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 0%, rgba(229, 9, 20, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        .category-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 22px;
            position: relative;
            gap: 16px;
        }

        .category-modal-header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
            border-radius: var(--radius-pill);
        }

        .category-title-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

<body>
    <!-- ============================================================
         CINEMATIC SPLASH SCREEN
         - Animated aurora background + scanlines + vignette
         - Floating dust particles (white & red)
         - Brand zoom-in, pulsing glow, loader bar
         - Layered Web Audio "cinema trailer" sound
         ============================================================ -->
    <div class="splash-screen" id="splashScreen">
        <!-- animated background layers -->
        <div class="splash-bg">
            <div class="splash-aurora"></div>
            <div class="splash-scanlines"></div>

        <!-- centered brand -->
        <div class="splash-logo-wrap">
            <div class="splash-brand">Cine<span>Stream</span></div>
            <div class="splash-tagline">Your Cinema, Anywhere</div>
        </div>

        <!-- loader -->
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>

    <!-- SITE CONTENT -->
    <div class="site-content" id="siteContent">
        <header id="app-navigation">
            <a href="#" class="logo" onclick="resetFilters(event)">Cine<span>Stream</span></a>
            <div class="nav-controls">
                <div class="category-tabs">
                    <button class="tab-btn active" onclick="navigateActiveTab('home', this)">Home</button>
                    <button class="tab-btn" onclick="navigateActiveTab('bollywood', this)">Bollywood</button>
                    <button class="tab-btn" onclick="navigateActiveTab('hollywood', this)">Hollywood</button>
                    <button class="tab-btn" onclick="navigateActiveTab('series', this)">Series</button>
                </div>
                <div class="search-container">
                    <input type="text" id="live-search" placeholder="Quick search...">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
            </div>
        </header>

        <section class="hero-carousel-container" id="hero-carousel-container">
            <div class="hero-track" id="main-slider-track"></div>
            <div class="carousel-dots" id="slider-dots-box"></div>
        </section>

        <main class="content-wrap">
            <section class="row-container" id="bollywood-track-wrapper">
                <div class="row-header">
                    <h2 class="row-title">Bollywood Hits</h2>
                    <div class="carousel-arrows">
                        <button class="arrow-btn" onclick="scrollCarousel('bollywood-render-grid', -1)"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
                        <button class="arrow-btn" onclick="scrollCarousel('bollywood-render-grid', 1)"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
                    </div>
                </div>
                <div class="carousel-viewport" id="bollywood-render-grid"></div>
            </section>

            <section class="row-container" id="hollywood-track-wrapper">
                <div class="row-header">
                    <h2 class="row-title">Hollywood Blockbusters</h2>
                    <div class="carousel-arrows">
                        <button class="arrow-btn" onclick="scrollCarousel('hollywood-render-grid', -1)"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
                        <button class="arrow-btn" onclick="scrollCarousel('hollywood-render-grid', 1)"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>

            <section class="row-container" id="series-track-wrapper">
                <div class="row-header">

                        <button class="arrow-btn" onclick="scrollCarousel('series-render-grid', -1)"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
                        <button class="arrow-btn" onclick="scrollCarousel('series-render-grid', 1)"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>

    </div>

    <!-- REFINED CATEGORY MODAL -->
    <div class="category-modal-overlay" id="global-category-overlay">
        <div class="category-modal-header">
            <div class="category-title-block">
                <h2 class="category-modal-title" id="category-title-target">Category</h2>
                <span class="category-modal-subtitle" id="category-subtitle-target">Browse our curated collection</span>
            </div>
            <button class="close-category-btn" onclick="closeCategoryModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Home
            </button>
        </div>
        <div class="category-movies-grid" id="category-grid-target"></div>
        <div class="see-more-trigger-container" id="see-more-action-box">
            <button class="btn-see-more" onclick="loadNextCategoryBatch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                See More
            </button>
        </div>
    </div>

    <div class="details-panel-overlay" id="global-details-panel">
        <div class="details-card-box">
            <button class="close-details-btn" onclick="closeDetailsPanel()">&times;</button>
            <div class="details-banner-img" id="panel-banner-target"></div>
            <div class="details-info-content">
                <h2 class="details-title" id="panel-title-target">Title</h2>
                <div class="details-meta-row">
                    <span class="rating-star" id="panel-rating-target">★ 0.0</span>
                    <span id="panel-type-target">MOVIE</span>
                    <span>•</span>
                    <span id="panel-genre-target">Genre</span>
                </div>
                <p class="details-desc-text" id="panel-desc-target">Description</p>
                <button class="play-master-btn" id="panel-play-trigger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Stream Video Now
                </button>
            </div>
        </div>
    </div>

    <div class="player-modal" id="global-player-overlay">
        <div class="player-window-box">
            <button class="close-player-btn" onclick="closeCinemaScreen()">&times;</button>
            <iframe id="cinema-frame-element" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        /* ============================================================
           SPLASH SCREEN CONTROLLER
           - Spawns floating dust particles
           - Plays a layered "cinema trailer" sound via Web Audio
           ============================================================ */
        (function() {
            const splash = document.getElementById('splashScreen');
            const siteContent = document.getElementById('siteContent');
            const particleField = document.getElementById('particleField');

            /* ---------- 1. Generate floating dust particles ---------- */
            function spawnParticles() {
                if (!particleField) return;
                const count = 42; // total particles
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('span');
                    p.className = 'particle' + (Math.random() < 0.35 ? ' red' : '');

                    // random size between 1.5px and 4.5px
                    const size = (Math.random() * 3 + 1.5).toFixed(2);
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';

                    // random start position
                    p.style.left = (Math.random() * 100) + '%';
                    p.style.bottom = (-10 - Math.random() * 20) + '%';

                    // random duration 6s - 16s
                    const dur = (Math.random() * 10 + 6).toFixed(2);
                    p.style.animationDuration = dur + 's';

                    // random delay so they don't all appear at once
                    p.style.animationDelay = (Math.random() * 6).toFixed(2) + 's';

                    // horizontal drift
                    p.style.setProperty('--drift', (Math.random() * 120 - 60).toFixed(0) + 'px');

                    // random opacity
                    p.style.opacity = (Math.random() * 0.5 + 0.2).toFixed(2);

                    particleField.appendChild(p);
                }
            }

            /* ---------- 2. Layered cinematic sound ---------- */
            function playCinematicSound() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;

                    const ctx = new AudioCtx();
                    const now = ctx.currentTime;

                    // Master gain
                    const master = ctx.createGain();
                    master.gain.setValueAtTime(0.9, now);
                    master.connect(ctx.destination);

                    // --- A) Deep sub-bass rumble (cinema subwoofer) ---
                    const subOsc = ctx.createOscillator();
                    const subGain = ctx.createGain();
                    subOsc.type = 'sine';
                    subOsc.frequency.setValueAtTime(55, now);
                    subOsc.frequency.exponentialRampToValueAtTime(28, now + 1.4);
                    subGain.gain.setValueAtTime(0.001, now);
                    subGain.gain.linearRampToValueAtTime(0.26, now + 0.15);
                    subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                    subOsc.connect(subGain).connect(master);
                    subOsc.start(now);
                    subOsc.stop(now + 1.5);

                    // --- B) Trailer "whoosh" sweep (sawtooth) ---
                    const sweepOsc = ctx.createOscillator();
                    const sweepGain = ctx.createGain();
                    sweepOsc.type = 'sawtooth';
                    sweepOsc.frequency.setValueAtTime(160, now + 0.05);
                    sweepOsc.frequency.exponentialRampToValueAtTime(1100, now + 0.7);
                    sweepGain.gain.setValueAtTime(0.001, now + 0.05);
                    sweepGain.gain.linearRampToValueAtTime(0.07, now + 0.2);
                    sweepGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
                    sweepOsc.connect(sweepGain).connect(master);
                    sweepOsc.start(now + 0.05);
                    sweepOsc.stop(now + 0.85);

                    // --- C) High shimmer / sparkle (triangle) ---
                    const shimmerOsc = ctx.createOscillator();
                    const shimmerGain = ctx.createGain();
                    shimmerOsc.type = 'triangle';
                    shimmerOsc.frequency.setValueAtTime(1500, now + 0.3);
                    shimmerOsc.frequency.exponentialRampToValueAtTime(2600, now + 0.65);
                    shimmerGain.gain.setValueAtTime(0.001, now + 0.3);
                    shimmerGain.gain.linearRampToValueAtTime(0.045, now + 0.38);
                    shimmerGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
                    shimmerOsc.connect(shimmerGain).connect(master);
                    shimmerOsc.start(now + 0.3);
                    shimmerOsc.stop(now + 1.0);

                    // --- D) Filtered noise burst (texture / impact) ---
                    const bufferSize = Math.floor(ctx.sampleRate * 0.55);
                    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const noiseData = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        noiseData[i] = (Math.random() * 2 - 1) * 0.5;
                    }
                    const noiseSrc = ctx.createBufferSource();
                    noiseSrc.buffer = noiseBuffer;
                    const noiseFilter = ctx.createBiquadFilter();
                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.value = 900;
                    noiseFilter.Q.value = 0.9;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.001, now + 0.1);
                    noiseGain.gain.linearRampToValueAtTime(0.055, now + 0.22);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                    noiseSrc.connect(noiseFilter).connect(noiseGain).connect(master);
                    noiseSrc.start(now + 0.1);
                    noiseSrc.stop(now + 0.7);

                    // --- E) Soft bell "logo reveal" tone (delayed) ---
                    const bellOsc = ctx.createOscillator();
                    const bellGain = ctx.createGain();
                    bellOsc.type = 'sine';
                    bellOsc.frequency.setValueAtTime(880, now + 0.55);
                    bellOsc.frequency.exponentialRampToValueAtTime(660, now + 1.1);
                    bellGain.gain.setValueAtTime(0.001, now + 0.55);
                    bellGain.gain.linearRampToValueAtTime(0.09, now + 0.65);
                    bellGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
                    bellOsc.connect(bellGain).connect(master);
                    bellOsc.start(now + 0.55);
                    bellOsc.stop(now + 1.4);

                } catch (e) {
                    // Audio blocked — silently fail
                }
            }

            /* ---------- 3. Autoplay + fallback handling ---------- */
            let soundPlayed = false;
            function tryPlaySound() {
                if (soundPlayed) return;
                soundPlayed = true;
                playCinematicSound();
            }

            // Try immediately on script execution (may be blocked)
            tryPlaySound();

            // Fallback on first user gesture
            const gestureEvents = ['click', 'touchstart', 'keydown', 'pointerdown'];
            gestureEvents.forEach(evt => {
                document.addEventListener(evt, tryPlaySound, { once: true, passive: true });
            });

            // Also try on window load
            window.addEventListener('load', tryPlaySound);

            /* ---------- 4. Boot splash ---------- */
            spawnParticles();

            const SPLASH_DURATION = 3200; // 3.2s to let the animation breathe
            setTimeout(() => {
                splash.classList.add('hidden');
                siteContent.classList.add('revealed');
            }, SPLASH_DURATION);
        })();

        /* ============================================================
           CATEGORY MODAL CONTROLLER
           ============================================================ */
        let trackingCategoryToken = "";
        let displayedItemCount = 0;
        let totalSourceItems = 0;
        let cachedSourceCards = [];

        function navigateActiveTab(categoryKey, activeBtn) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');

            if (categoryKey === 'home') {
                closeCategoryModal();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            openCategoryModal(categoryKey);
        }

        function getVisibleColumnCount() {
            const grid = document.getElementById('category-grid-target');
            if (!grid) return 4;
            const style = window.getComputedStyle(grid);
            const cols = style.gridTemplateColumns.split(' ').filter(Boolean).length;
            return Math.max(cols, 1);
        }

        function openCategoryModal(categoryKey) {
            trackingCategoryToken = categoryKey;
            displayedItemCount = 0;

            const targetModal = document.getElementById('global-category-overlay');
            const targetTitle = document.getElementById('category-title-target');
            const targetSubtitle = document.getElementById('category-subtitle-target');
            const targetGrid = document.getElementById('category-grid-target');
            const actionsBox = document.getElementById('see-more-action-box');
            const mainHeader = document.getElementById('app-navigation');

            const displayName = categoryKey.charAt(0).toUpperCase() + categoryKey.slice(1);
            targetTitle.innerText = displayName + " Collection";
            targetSubtitle.innerText = "Explore the best of " + displayName + " — curated just for you";

            targetGrid.innerHTML = "";
            targetModal.classList.add('active');

            mainHeader.style.display = "none";
            document.body.style.overflow = "hidden";
            targetModal.scrollTop = 0;

            history.pushState({ modal: categoryKey }, '', `#${categoryKey}`);

            const sourceRow = document.getElementById(`${categoryKey}-render-grid`);
            cachedSourceCards = sourceRow
                ? Array.from(sourceRow.querySelectorAll('.media-card'))
                : [];
            totalSourceItems = cachedSourceCards.length;

            if (totalSourceItems === 0) {
                targetGrid.innerHTML = `<p class="empty-placeholder-msg">No media entries found for this category yet.</p>`;
                actionsBox.style.display = "none";
                return;
            }

            const cols = getVisibleColumnCount();
            const rowsToShow = 3;
            const firstBatchSize = Math.min(cols * rowsToShow, totalSourceItems);

            renderCategoryBatch(firstBatchSize);
        }

        function renderCategoryBatch(batchSize) {
            const targetGrid = document.getElementById('category-grid-target');
            const actionsBox = document.getElementById('see-more-action-box');

            const nextCount = Math.min(displayedItemCount + batchSize, totalSourceItems);
            const itemsToAdd = cachedSourceCards.slice(displayedItemCount, nextCount);

            if (itemsToAdd.length === 0) {
                actionsBox.style.display = "none";
                return;
            }

            const fragment = document.createDocumentFragment();

            itemsToAdd.forEach(card => {
                const clone = card.cloneNode(true);
                clone.addEventListener('click', (e) => {
                    e.preventDefault();
                    card.click();
                });
                fragment.appendChild(clone);
            });

            targetGrid.appendChild(fragment);
            displayedItemCount = nextCount;

            const hasMore = displayedItemCount < totalSourceItems;
            actionsBox.style.display = hasMore ? "flex" : "none";

            if (hasMore) {
                const remaining = totalSourceItems - displayedItemCount;
                const cols = getVisibleColumnCount();
                const wouldBeOrphanRow = remaining > 0 && remaining < cols;
                if (wouldBeOrphanRow) {
                    renderCategoryBatch(remaining);
                }
            }
        }

        function loadNextCategoryBatch() {
            const cols = getVisibleColumnCount();
            const nextBatch = Math.min(cols * 2, totalSourceItems - displayedItemCount);
            renderCategoryBatch(nextBatch || totalSourceItems - displayedItemCount);
        }

        function closeCategoryModal() {
            if (window.location.hash) {
                history.back();
            } else {
                document.getElementById('global-category-overlay').classList.remove('active');
                document.getElementById('app-navigation').style.display = "flex";
                document.body.style.overflow = "";
            }
        }

        window.addEventListener('popstate', (event) => {
            const targetModal = document.getElementById('global-category-overlay');

            if (targetModal.classList.contains('active')) {
                targetModal.classList.remove('active');
                document.getElementById('app-navigation').style.display = "flex";
                document.body.style.overflow = "";
                displayedItemCount = 0;
                cachedSourceCards = [];
                totalSourceItems = 0;

                const originalTabs = document.querySelectorAll('.tab-btn');
                originalTabs.forEach(btn => btn.classList.remove('active'));
                if (originalTabs[0]) originalTabs[0].classList.add('active');
            }
        });

        function resetFilters(event) {
            event.preventDefault();
            closeCategoryModal();
            if (!window.location.hash) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.addEventListener('scroll', () => {
            const navigationBar = document.getElementById('app-navigation');
            if (navigationBar.style.display === 'none') return;

            if (window.scrollY > 20) {
                navigationBar.classList.add('scrolled');
            } else {
                navigationBar.classList.remove('scrolled');
            }
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            const modal = document.getElementById('global-category-overlay');
            if (!modal.classList.contains('active')) return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const cols = getVisibleColumnCount();
                const remainder = displayedItemCount % cols;
                if (remainder !== 0 && displayedItemCount < totalSourceItems) {
                    const toAdd = Math.min(cols - remainder, totalSourceItems - displayedItemCount);
                    if (toAdd > 0) renderCategoryBatch(toAdd);
                }
            }, 200);
        });
    </script>
